<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VG Gallery Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:24px;max-width:900px;margin:0 auto}
h1{font-size:20px;font-weight:300;margin-bottom:4px}
.sub{font-size:11px;color:#555;letter-spacing:2px;text-transform:uppercase;margin-bottom:24px}
.section{background:#111;border:.5px solid #222;border-radius:12px;padding:20px;margin-bottom:16px}
.section h2{font-size:13px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#888;margin-bottom:14px}
label{display:block;font-size:11px;color:#666;margin-bottom:4px;letter-spacing:1px;text-transform:uppercase}
input[type=text],select{width:100%;background:#0a0a0a;border:.5px solid #333;border-radius:8px;padding:10px 12px;color:#fff;font-size:13px;margin-bottom:0;outline:none;font-family:inherit}
input[type=text]:focus,select:focus{border-color:#555}
.btn{display:inline-block;padding:10px 20px;font-size:11px;letter-spacing:2px;text-transform:uppercase;background:#fff;color:#000;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-family:inherit}
.btn:hover{background:#ddd}
.btn-sm{padding:7px 14px;font-size:10px;background:#1a1a1a;color:#888;border:.5px solid #333;border-radius:6px;cursor:pointer;font-family:inherit;letter-spacing:1px;text-transform:uppercase}
.btn-sm:hover{background:#222;color:#fff}
.btn-danger{background:#1a0505;color:#E74C3C;border-color:#3a1010}
.btn-danger:hover{background:#2a0808;color:#ff6b6b}
.row{display:flex;gap:10px;margin-bottom:12px;align-items:flex-end;flex-wrap:wrap}
.row>div{flex:1;min-width:120px}
.drop{border:2px dashed #333;border-radius:12px;padding:50px 40px;text-align:center;cursor:pointer;margin-bottom:12px;transition:border-color .2s}
.drop:hover,.drop.over{border-color:#2ECC71}
.drop-text{font-size:12px;color:#555;letter-spacing:2px;text-transform:uppercase}
.drop-sub{font-size:10px;color:#333;margin-top:8px}
.progress{height:6px;background:#222;border-radius:3px;margin-top:8px;overflow:hidden}
.progress-bar{height:100%;background:#2ECC71;transition:width .3s;width:0%}
.file-list{max-height:200px;overflow-y:auto;margin-top:10px}
.file-item{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:.5px solid #1a1a1a;font-size:11px;color:#888}
.st{font-size:9px;letter-spacing:1px;text-transform:uppercase;padding:2px 8px;border-radius:4px}
.st.done{color:#2ECC71;background:rgba(46,204,113,.1)}
.st.err{color:#E74C3C;background:rgba(231,76,60,.1)}
.st.up{color:#F39C12;background:rgba(243,156,18,.1)}
.log{background:#050505;border:.5px solid #222;border-radius:8px;padding:12px;font-size:10px;color:#666;max-height:160px;overflow-y:auto;margin-top:12px;font-family:monospace;white-space:pre-wrap;line-height:1.6}
/* Photo grid */
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:12px}
.photo-card{background:#0a0a0a;border:.5px solid #222;border-radius:8px;overflow:hidden;position:relative}
.photo-card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#1a1a1a}
.photo-card .photo-actions{display:flex;gap:4px;padding:6px;background:#0d0d0d}
.photo-card .photo-name{font-size:9px;color:#555;padding:0 6px 6px;text-overflow:ellipsis;overflow:hidden;white-space:nowrap}
/* Inline edit */
.inline-edit{display:flex;gap:6px;align-items:center;margin-top:6px}
.inline-edit input{flex:1;background:#0a0a0a;border:.5px solid #444;border-radius:6px;padding:6px 10px;color:#fff;font-size:12px;outline:none;font-family:inherit}
/* Toast */
.toast{position:fixed;bottom:24px;right:24px;background:#2ECC71;color:#000;padding:12px 20px;border-radius:8px;font-size:12px;font-weight:600;z-index:999;display:none;max-width:300px}
.toast.show{display:block}
.toast.error{background:#E74C3C;color:#fff}
/* Modal confirm */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal-box{background:#111;border:.5px solid #333;border-radius:12px;padding:24px;max-width:360px;width:90%}
.modal-box h3{font-size:15px;font-weight:400;margin-bottom:10px}
.modal-box p{font-size:12px;color:#777;margin-bottom:20px;line-height:1.5}
.modal-box .btns{display:flex;gap:8px;justify-content:flex-end}
</style>
</head>

function api(table,method,params,body){
  var url=SB+'/rest/v1/'+table+(params?'?'+params:'');
  var h={'apikey':SK,'Authorization':'Bearer '+SK,'Content-Type':'application/json'};
  if(method==='POST')h['Prefer']='return=representation';

  var o={method:method,headers:h};
  if(body)o.body=JSON.stringify(body);

    if(method==='PATCH'||method==='DELETE')return null;
    return r.json();
  });
}

function thumb(url,w){

}

    var h2=Object.assign({},h,{'Prefer':'resolution=merge-duplicates,return=minimal'});
    var body=Object.assign({id:PID},patch);
    return fetch(SB+'/rest/v1/projects',{method:'POST',headers:h2,body:JSON.stringify(body)});
  }).catch(function(){});
}

function loadData(){
  // Load project name
  api('projects','GET','id=eq.'+PID).then(function(p){
    if(p&&p[0]){
      projName=p[0].name||projName;
      var el=document.getElementById('projNameDisplay');
      if(el)el.textContent=projName;
    }
  }).catch(function(){});

  L('Cargando días...');
  api('days','GET','project_id=eq.'+PID+'&order=sort_order').then(function(d){
    days=d||[];
    var sel=document.getElementById('daySelect');
    sel.innerHTML=days.map(function(x){return '<option value="'+x.id+'">'+x.name+'</option>';}).join('');
    L(''+days.length+' días cargados');
    if(days.length)onDayChange();
    else{document.getElementById('lookSelect').innerHTML='';document.getElementById('existingPhotos').innerHTML='<span style="font-size:11px;color:#555">No hay días</span>';}
  }).catch(function(e){L('ERROR: '+e.message);T('Error cargando',true);});
}

function onDayChange(){
  var did=document.getElementById('daySelect').value;
  if(!did)return;
  api('looks','GET','day_id=eq.'+did+'&order=sort_order').then(function(lk){
    aLooks[did]=lk||[];
    document.getElementById('lookSelect').innerHTML=(lk||[]).map(function(x){return '<option value="'+x.id+'">'+x.name+'</option>';}).join('');
    L(''+(lk||[]).length+' looks cargados');
    loadPhotos();
  }).catch(function(e){L('ERROR: '+e.message);});
}

function loadPhotos(){
  var lid=document.getElementById('lookSelect').value;
  var el=document.getElementById('existingPhotos');
  if(!lid){el.innerHTML='<span style="font-size:11px;color:#555">Selecciona un look</span>';return;}
  api('photos','GET','look_id=eq.'+lid+'&order=sort_order').then(function(photos){
    el.innerHTML='';
    if(!photos||!photos.length){
      el.innerHTML='<span style="font-size:11px;color:#555">No hay fotos</span>';
      return;
    }
    var header=document.createElement('div');
    header.style.cssText='font-size:10px;color:#555;margin-bottom:8px;letter-spacing:1px;text-transform:uppercase';
    header.textContent=photos.length+' foto'+(photos.length!==1?'s':'');
    el.appendChild(header);

    var grid=document.createElement('div');
    grid.className='photo-grid';
    photos.forEach(function(p){
      var card=document.createElement('div');
      card.className='photo-card';

      var img=document.createElement('img');
      img.src=thumb(p.url,200);
      img.alt=p.label||'';
      card.appendChild(img);

      var name=document.createElement('div');
      name.className='photo-name';
      name.title=p.label||'';
      name.textContent=p.label||'—';
      card.appendChild(name);

      var actions=document.createElement('div');
      actions.className='photo-actions';

      // Replace button
      var replBtn=document.createElement('button');
      replBtn.className='btn-sm';
      replBtn.style.flex='1';
      replBtn.textContent='↺ Reemplazar';
      replBtn.addEventListener('click',function(){replacePhoto(p,img);});
      actions.appendChild(replBtn);

      // Delete button
      var delBtn=document.createElement('button');
      delBtn.className='btn-sm btn-danger';
      delBtn.style.flex='1';
      delBtn.textContent='✕ Borrar';
      delBtn.addEventListener('click',function(){deletePhoto(p,card);});
      actions.appendChild(delBtn);

      card.appendChild(actions);
      grid.appendChild(card);
    });
    el.appendChild(grid);
  }).catch(function(e){L('ERROR: '+e.message);});
}

/* ── Delete photo ── */
function deletePhoto(photo,card){
  confirm('Borrar foto','¿Seguro que quieres borrar "'+( photo.label||'esta foto')+'"? Esta acción no se puede deshacer.',function(){
    L('Borrando: '+photo.label);
    api('photos','DELETE','id=eq.'+photo.id).then(function(){
      T('Foto borrada');
      L('Borrada: '+photo.label);
      card.style.opacity='0.3';
      card.style.pointerEvents='none';
      setTimeout(function(){if(card.parentNode)card.parentNode.removeChild(card);},500);
    }).catch(function(e){L('ERROR: '+e.message);T('Error al borrar',true);});
  });
}

/* ── Replace photo ── */
function replacePhoto(photo,imgEl){
  var input=document.createElement('input');
  input.type='file';input.accept='image/*';
  input.addEventListener('change',function(){
    if(!input.files||!input.files[0])return;
    var file=input.files[0];
    L('Reemplazando: '+photo.label);
    T('Subiendo...');
    var fd=new FormData();
    fd.append('file',file);
    fd.append('upload_preset',CP);
    fetch('https://api.cloudinary.com/v1_1/'+CN+'/image/upload',{method:'POST',body:fd})
    .then(function(r){return r.json();})
    .then(function(data){
      if(data.error)throw new Error(data.error.message);
      return api('photos','PATCH','id=eq.'+photo.id,{url:data.secure_url});
    })
    .then(function(){
      photo.url=arguments[0]&&arguments[0].url||photo.url;
      imgEl.src=thumb(data&&data.secure_url||photo.url,200)+'?t='+Date.now();
      T('Foto reemplazada');
      L('OK reemplazada: '+photo.label);
      loadPhotos();
    })
    .catch(function(e){L('ERROR: '+e.message);T('Error: '+e.message,true);});
  });
  input.click();
}

/* ── Delete Day ── */
document.getElementById('btnDeleteDay').addEventListener('click',function(){
  var did=document.getElementById('daySelect').value;
  if(!did){T('Selecciona un día',true);return;}
  var d=days.find(function(x){return x.id===did;});
  confirm('Borrar día','¿Borrar el día "'+(d?d.name:'')+'" y todos sus looks y fotos?',function(){
    // delete all photos in all looks of this day first
    var looks=aLooks[did]||[];
    var delPhotos=looks.map(function(l){
      return api('photos','DELETE','look_id=eq.'+l.id).catch(function(){});
    });
    Promise.all(delPhotos).then(function(){
      return Promise.all(looks.map(function(l){return api('looks','DELETE','id=eq.'+l.id).catch(function(){});}));
    }).then(function(){
      return api('days','DELETE','id=eq.'+did);
    }).then(function(){
      T('Día borrado');L('Día borrado: '+(d?d.name:''));
      loadData();
    }).catch(function(e){L('ERROR: '+e.message);T('Error: '+e.message,true);});
  });
});

/* ── Upload ── */
var dz=document.getElementById('dropzone');
var fi=document.getElementById('fileInput');
dz.addEventListener('click',function(){fi.click();});
dz.addEventListener('dragover',function(e){e.preventDefault();dz.classList.add('over');});
dz.addEventListener('dragleave',function(){dz.classList.remove('over');});
dz.addEventListener('drop',function(e){e.preventDefault();dz.classList.remove('over');doUpload(e.dataTransfer.files);});
fi.addEventListener('change',function(){if(fi.files.length)doUpload(fi.files);fi.value='';});

function doUpload(files){
  var did=document.getElementById('daySelect').value;
  var lid=document.getElementById('lookSelect').value;
  if(!did||!lid){T('Selecciona Day & Look primero',true);return;}
  var list=document.getElementById('fileList');
  var bar=document.getElementById('progressBar');
  var total=files.length,done=0;
  list.innerHTML='';bar.style.width='0%';
  L('Subiendo '+total+' fotos...');
  for(var i=0;i<total;i++){
    (function(file,idx){
      var item=document.createElement('div');
      item.className='file-item';
      item.innerHTML='<span>'+file.name+'</span><span class="st up">subiendo</span>';
      list.appendChild(item);
      var fd=new FormData();
      fd.append('file',file);fd.append('upload_preset',CP);
      fetch('https://api.cloudinary.com/v1_1/'+CN+'/image/upload',{method:'POST',body:fd})
      .then(function(r){if(!r.ok)throw new Error('Cloudinary '+r.status);return r.json();})
      .then(function(data){
        if(data.error)throw new Error(data.error.message);
        L('Cloudinary OK: '+file.name);
        return api('photos','POST',null,{look_id:lid,day_id:did,url:data.secure_url,label:file.name.replace(/\.[^.]+$/,''),sort_order:idx,stars:0});
      })
      .then(function(){
        item.querySelector('.st').className='st done';
        item.querySelector('.st').textContent='ok';
        done++;bar.style.width=Math.round(done/total*100)+'%';
        L('OK: '+file.name);
        if(done===total){T(total+' fotos subidas!');loadPhotos();}
      })
      .catch(function(e){
        item.querySelector('.st').className='st err';
        item.querySelector('.st').textContent='error';
        done++;bar.style.width=Math.round(done/total*100)+'%';
        L('FAIL '+file.name+': '+e.message);T(e.message,true);
      });
    })(files[i],i);
  }
}

document.getElementById('renameLookInput').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('btnRenameLookOk').click();if(e.key==='Escape')document.getElementById('btnRenameLookCancel').click();});

document.getElementById('daySelect').addEventListener('change',onDayChange);
document.getElementById('lookSelect').addEventListener('change',loadPhotos);

function editProjName(){
  var cur=projName;
  var el=document.getElementById('projNameDisplay');
  var inp=document.createElement('input');
  inp.value=cur;
  inp.style.cssText='background:transparent;border:none;border-bottom:1px solid #555;color:#e0e0e0;font-size:13px;font-family:inherit;outline:none;width:200px;letter-spacing:.3px';
  el.replaceWith(inp);inp.focus();inp.select();
  function commit(){
    var v=inp.value.trim()||cur;
    projName=v;
    saveProjectData({name:v});
    var newEl=document.createElement('div');
    newEl.id='projNameDisplay';
    newEl.title='Click para editar nombre';
    newEl.onclick=editProjName;
    newEl.style.cssText='font-size:13px;color:#e0e0e0;letter-spacing:.3px;cursor:pointer;display:flex;align-items:center;gap:8px';
    newEl.innerHTML=v+'<span style="font-size:9px;color:#333;letter-spacing:1px">✏</span>';
    inp.replaceWith(newEl);
  }
  inp.addEventListener('blur',commit);
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')inp.blur();if(e.key==='Escape'){inp.value=cur;inp.blur();}});
}

loadData();
