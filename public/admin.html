<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VG Gallery Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:24px;max-width:800px;margin:0 auto}
h1{font-size:20px;font-weight:300;margin-bottom:4px}
.sub{font-size:11px;color:#555;letter-spacing:2px;text-transform:uppercase;margin-bottom:24px}
.section{background:#111;border:.5px solid #222;border-radius:12px;padding:20px;margin-bottom:16px}
.section h2{font-size:13px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#888;margin-bottom:12px}
label{display:block;font-size:11px;color:#666;margin-bottom:4px;letter-spacing:1px;text-transform:uppercase}
input[type=text],select{width:100%;background:#0a0a0a;border:.5px solid #333;border-radius:8px;padding:10px 12px;color:#fff;font-size:13px;margin-bottom:12px;outline:none}
input[type=text]:focus,select:focus{border-color:#555}
.btn{padding:10px 20px;font-size:11px;letter-spacing:2px;text-transform:uppercase;background:#fff;color:#000;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-family:inherit}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn-sm{padding:6px 14px;font-size:10px;background:#222;color:#aaa;border:.5px solid #333}
.row{display:flex;gap:8px;margin-bottom:12px}
.row>*{flex:1}
.drop{border:2px dashed #333;border-radius:12px;padding:40px;text-align:center;cursor:pointer;margin-bottom:12px;transition:border-color .2s}
.drop:hover,.drop.over{border-color:#2ECC71}
.drop-text{font-size:11px;color:#555;letter-spacing:2px;text-transform:uppercase}
.progress{height:4px;background:#222;border-radius:2px;margin-top:4px;overflow:hidden}
.progress-bar{height:100%;background:#2ECC71;transition:width .3s}
.file-list{max-height:200px;overflow-y:auto;margin-top:8px}
.file-item{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:.5px solid #1a1a1a;font-size:11px;color:#888}
.file-item .status{font-size:9px;letter-spacing:1px;text-transform:uppercase}
.file-item .status.done{color:#2ECC71}
.file-item .status.err{color:#E74C3C}
.file-item .status.up{color:#F39C12}
.log{background:#050505;border:.5px solid #222;border-radius:8px;padding:12px;font-size:10px;color:#444;max-height:150px;overflow-y:auto;margin-top:12px;font-family:monospace;white-space:pre-wrap}
.existing{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:4px;margin-top:8px}
.existing img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px}
</style>
</head>
<body>
<h1>VG Gallery Admin</h1>
<div class="sub">Upload & manage photos</div>

<div class="section">
<h2>1. Select Day & Look</h2>
<div class="row">
  <div>
    <label>Day</label>
    <select id="daySelect" onchange="onDayChange()"></select>
  </div>
  <div>
    <label>Look</label>
    <select id="lookSelect"></select>
  </div>
</div>
<div class="row">
  <div>
    <label>New Day Name</label>
    <input type="text" id="newDayName" placeholder="Day 2">
  </div>
  <div style="display:flex;align-items:flex-end;padding-bottom:12px">
    <button class="btn btn-sm" onclick="createDay()">+ Add Day</button>
  </div>
</div>
<div class="row">
  <div>
    <label>New Look Name</label>
    <input type="text" id="newLookName" placeholder="Look 02">
  </div>
  <div style="display:flex;align-items:flex-end;padding-bottom:12px">
    <button class="btn btn-sm" onclick="createLook()">+ Add Look</button>
  </div>
</div>
</div>

<div class="section">
<h2>2. Upload Photos</h2>
<div class="drop" id="dropzone" onclick="document.getElementById('fileInput').click()">
  <div class="drop-text">Drop photos here or click to select</div>
  <input type="file" id="fileInput" accept="image/*" multiple style="display:none" onchange="handleFiles(this.files)">
</div>
<div class="progress"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
<div class="file-list" id="fileList"></div>
<div class="log" id="log"></div>
</div>

<div class="section">
<h2>Current Photos</h2>
<div id="existingPhotos"><span style="font-size:11px;color:#555">Select a day & look to see photos</span></div>
</div>

<script>
var SUPABASE_URL='https://rdzjbvkzpusegtyudhtn.supabase.co';
var SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkempidmt6cHVzZWd0eXVkaHRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyMTU0MDEsImV4cCI6MjA5MDc5MTQwMX0.25id5riBB8LHywjLcXOZC8te62MnL-LvICF6Dfv9jDI';
var CLOUD_NAME='dfkxnfxof';
var UPLOAD_PRESET='ut6grqjj';
var PROJECT_ID='00000000-0000-0000-0000-000000000001';

var days=[],allLooks={};

function sb(table,method,params,body){
  var url=SUPABASE_URL+'/rest/v1/'+table;
  if(params)url+='?'+params;
  var opts={method:method||'GET',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=representation'}};
  if(body)opts.body=JSON.stringify(body);
  return fetch(url,opts).then(function(r){return r.json();});
}

function log(msg){var el=document.getElementById('log');el.textContent+=msg+'\n';el.scrollTop=el.scrollHeight;}

/* Load days and looks */
function loadData(){
  sb('days','GET','project_id=eq.'+PROJECT_ID+'&order=sort_order').then(function(d){
    days=d||[];
    var sel=document.getElementById('daySelect');
    sel.innerHTML=days.map(function(day){return '<option value="'+day.id+'">'+day.name+'</option>';}).join('');
    if(days.length)onDayChange();
    log('Loaded '+days.length+' days');
  });
}

function onDayChange(){
  var dayId=document.getElementById('daySelect').value;
  if(!dayId)return;
  sb('looks','GET','day_id=eq.'+dayId+'&order=sort_order').then(function(looks){
    allLooks[dayId]=looks||[];
    var sel=document.getElementById('lookSelect');
    sel.innerHTML=(looks||[]).map(function(l){return '<option value="'+l.id+'">'+l.name+'</option>';}).join('');
    loadExisting();
  });
}

function loadExisting(){
  var lookId=document.getElementById('lookSelect').value;
  if(!lookId){document.getElementById('existingPhotos').innerHTML='<span style="font-size:11px;color:#555">No look selected</span>';return;}
  sb('photos','GET','look_id=eq.'+lookId+'&order=sort_order').then(function(photos){
    var el=document.getElementById('existingPhotos');
    if(!photos||!photos.length){el.innerHTML='<span style="font-size:11px;color:#555">No photos yet</span>';return;}
    el.innerHTML='<div class="existing">'+photos.map(function(p){
      var thumb=p.url;
      if(thumb&&thumb.indexOf('cloudinary.com')>-1)thumb=thumb.replace('/upload/','/upload/w_100,q_auto,f_auto/');
      return '<img src="'+thumb+'" loading="lazy"/>';
    }).join('')+'</div>';
    log(photos.length+' photos in this look');
  });
}

function createDay(){
  var name=document.getElementById('newDayName').value.trim();
  if(!name){alert('Enter a day name');return;}
  sb('days','POST',null,{project_id:PROJECT_ID,name:name,sort_order:days.length}).then(function(){
    document.getElementById('newDayName').value='';
    log('Created day: '+name);
    loadData();
  });
}

function createLook(){
  var dayId=document.getElementById('daySelect').value;
  var name=document.getElementById('newLookName').value.trim();
  if(!dayId||!name){alert('Select a day and enter a look name');return;}
  var order=(allLooks[dayId]||[]).length;
  sb('looks','POST',null,{day_id:dayId,name:name,sort_order:order}).then(function(){
    document.getElementById('newLookName').value='';
    log('Created look: '+name);
    onDayChange();
  });
}

/* Upload to Cloudinary then save URL to Supabase */
function uploadToCloudinary(file){
  var fd=new FormData();
  fd.append('file',file);
  fd.append('upload_preset',UPLOAD_PRESET);
  return fetch('https://api.cloudinary.com/v1_1/'+CLOUD_NAME+'/image/upload',{method:'POST',body:fd})
    .then(function(r){return r.json();})
    .then(function(data){
      if(data.error)throw new Error(data.error.message);
      return data.secure_url;
    });
}

function handleFiles(files){
  var dayId=document.getElementById('daySelect').value;
  var lookId=document.getElementById('lookSelect').value;
  if(!dayId||!lookId){alert('Select a day and look first!');return;}
  var list=document.getElementById('fileList');
  var bar=document.getElementById('progressBar');
  var total=files.length,done=0;
  list.innerHTML='';
  log('Uploading '+total+' files...');

  for(var i=0;i<files.length;i++){
    (function(file,idx){
      var item=document.createElement('div');
      item.className='file-item';
      item.innerHTML='<span>'+file.name+'</span><span class="status up">uploading...</span>';
      list.appendChild(item);

      uploadToCloudinary(file).then(function(url){
        var label=file.name.replace(/\.[^.]+$/,'');
        return sb('photos','POST',null,{look_id:lookId,day_id:dayId,url:url,label:label,sort_order:idx,stars:0});
      }).then(function(){
        item.querySelector('.status').className='status done';
        item.querySelector('.status').textContent='done';
        done++;
        bar.style.width=Math.round(done/total*100)+'%';
        log('✓ '+file.name);
        if(done===total){log('All uploads complete!');loadExisting();}
      }).catch(function(err){
        item.querySelector('.status').className='status err';
        item.querySelector('.status').textContent='error';
        done++;
        bar.style.width=Math.round(done/total*100)+'%';
        log('✗ '+file.name+': '+err.message);
      });
    })(files[i],i);
  }
}

/* Drag and drop */
var dz=document.getElementById('dropzone');
dz.addEventListener('dragover',function(e){e.preventDefault();dz.classList.add('over');});
dz.addEventListener('dragleave',function(){dz.classList.remove('over');});
dz.addEventListener('drop',function(e){e.preventDefault();dz.classList.remove('over');handleFiles(e.dataTransfer.files);});

document.getElementById('lookSelect').addEventListener('change',loadExisting);

loadData();
</script>
</body>
</html>
