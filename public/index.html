<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VG Studio Gallery</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif}
button,input,textarea,label{font-family:inherit}
button{cursor:pointer}
.loading{display:flex;align-items:center;justify-content:center;min-height:100vh;font-size:11px;color:#555;letter-spacing:2px;text-transform:uppercase}
</style>
</head>
<body>
<div id="APP"><div class="loading">Loading gallery...</div></div>
<script>
var SUPABASE_URL='https://rdzjbvkzpusegtyudhtn.supabase.co';
var SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkempidmt6cHVzZWd0eXVkaHRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyMTU0MDEsImV4cCI6MjA5MDc5MTQwMX0.25id5riBB8LHywjLcXOZC8te62MnL-LvICF6Dfv9jDI';
var CC=['#E74C3C','#F39C12','#2ECC71'],CL=['Reject','Review','Select'];

/* State */
var D={days:[],photos:[],mb:[],aDay:null,aLook:null,filt:null,sel:null,note:'',sf:null,hv:{},projectId:null};

/* Supabase REST helper */
function sb(table,method,params,body){
  var url=SUPABASE_URL+'/rest/v1/'+table;
  if(params)url+='?'+params;
  var opts={method:method||'GET',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':method==='PATCH'?'return=minimal':'return=representation'}};
  if(body)opts.body=JSON.stringify(body);
  return fetch(url,opts).then(function(r){
    if(method==='PATCH')return null;
    return r.json();
  });
}

/* Load all data */
function loadAll(){
  sb('projects','GET','limit=1').then(function(projects){
    if(!projects||!projects.length){document.getElementById('APP').innerHTML='<div class="loading">No project found. Use admin panel to create one.</div>';return;}
    D.projectId=projects[0].id;
    return Promise.all([
      sb('days','GET','project_id=eq.'+D.projectId+'&order=sort_order'),
      sb('photos','GET','order=sort_order'),
      sb('moodboard','GET','project_id=eq.'+D.projectId)
    ]);
  }).then(function(res){
    if(!res)return;
    D.days=res[0]||[];
    /* Load looks for each day */
    var lookPromises=D.days.map(function(d){return sb('looks','GET','day_id=eq.'+d.id+'&order=sort_order');});
    D.photos=res[1]||[];
    D.mb=res[2]||[];
    return Promise.all(lookPromises);
  }).then(function(looksArrays){
    if(!looksArrays)return;
    for(var i=0;i<D.days.length;i++){D.days[i].looks=looksArrays[i]||[];}
    if(D.days.length>0){D.aDay=D.days[0].id;if(D.days[0].looks.length>0)D.aLook=D.days[0].looks[0].id;}
    R();
  }).catch(function(e){document.getElementById('APP').innerHTML='<div class="loading">Error loading: '+e.message+'</div>';});
}

/* Save star/color/note to Supabase */
function savePhoto(pid,patch){
  sb('photos','PATCH','id=eq.'+pid,patch);
}

/* Data ops */
function xSS(pid,val){
  for(var i=0;i<D.photos.length;i++){if(D.photos[i].id===pid){D.photos[i].stars=(D.photos[i].stars===val)?0:val;if(D.sel&&D.sel.id===pid)D.sel=D.photos[i];savePhoto(pid,{stars:D.photos[i].stars});break;}}R();
}
function xSC(pid,ci){
  for(var i=0;i<D.photos.length;i++){if(D.photos[i].id===pid){D.photos[i].color=(D.photos[i].color===ci)?null:ci;if(D.sel&&D.sel.id===pid)D.sel=D.photos[i];savePhoto(pid,{color:D.photos[i].color});break;}}R();
}
function xO(pid){for(var i=0;i<D.photos.length;i++){if(D.photos[i].id===pid){D.sel=D.photos[i];D.note=D.photos[i].note||'';break;}}R();}
function xCl(){if(D.sel){for(var i=0;i<D.photos.length;i++){if(D.photos[i].id===D.sel.id){D.photos[i].note=D.note;savePhoto(D.sel.id,{note:D.note});break;}}}D.sel=null;R();}
function xF(f){D.filt=f;R();}
function xD(id){D.aDay=id;for(var i=0;i<D.days.length;i++){if(D.days[i].id===id){D.aLook=D.days[i].looks.length?D.days[i].looks[0].id:null;break;}}D.filt=null;R();}
function xL(id){D.aLook=id;D.filt=null;R();}
function xV(v){D.aDay=null;D.aLook=v;R();}
function xSF(s){D.sf=(D.sf===s)?null:s;R();}
function xH(pid,s){D.hv[pid]=s;R();}
function xN(v){D.note=v;}

/* HTML builders */
function hS(v,pid){var hov=D.hv[pid]||0,o='';for(var s=1;s<=5;s++){var on=(hov||v)>=s;o+='<span style="font-size:14px;cursor:pointer;color:'+(on?'#fff':'#444')+';user-select:none" onmouseenter="xH(\''+pid+'\','+s+')" onmouseleave="xH(\''+pid+'\',0)" onclick="event.stopPropagation();xSS(\''+pid+'\','+s+')">&#9733;</span>';}return o;}
function hD(pid,col){var o='';for(var i=0;i<3;i++){var a=col===i;o+='<div style="width:8px;height:8px;border-radius:50%;cursor:pointer;background:'+(a?CC[i]:'#333')+';border:.5px solid '+(a?CC[i]:'#444')+'" onclick="event.stopPropagation();xSC(\''+pid+'\','+i+')"></div>';}return o;}
function hMD(pid,col){var o='';for(var i=0;i<3;i++){var a=col===i;o+='<div style="display:flex;align-items:center;gap:4px;cursor:pointer;opacity:'+(a?1:.3)+'" onclick="event.stopPropagation();xSC(\''+pid+'\','+i+')"><div style="width:9px;height:9px;border-radius:50%;background:'+CC[i]+'"></div><span style="font-size:9px;letter-spacing:1px;text-transform:uppercase;color:'+CC[i]+'">'+CL[i]+'</span></div>';}return o;}

function thumbUrl(url){
  /* Cloudinary: insert w_400,q_auto for thumbnails */
  if(url&&url.indexOf('cloudinary.com')>-1){return url.replace('/upload/','/upload/w_400,q_auto,f_auto/');}
  return url;
}

function hG(photos){
  if(!photos.length)return '<div style="text-align:center;padding:48px 0;font-size:11px;color:#333;letter-spacing:2px;text-transform:uppercase">No photos</div>';
  var h='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#222">';
  for(var i=0;i<photos.length;i++){var p=photos[i];
    h+='<div style="background:#000;cursor:pointer" onclick="xO(\''+p.id+'\')">';
    h+='<div style="aspect-ratio:2/3;background:#111;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden">';
    if(p.url)h+='<img src="'+thumbUrl(p.url)+'" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"/>';
    if(p.color!==null&&p.color!==undefined)h+='<div style="position:absolute;top:8px;left:8px;width:8px;height:8px;border-radius:50%;background:'+CC[p.color]+'"></div>';
    if(p.stars>0)h+='<div style="position:absolute;bottom:8px;left:8px;font-size:10px;color:#aaa">'+'&#9733;'.repeat(p.stars)+'</div>';
    if(p.note)h+='<div style="position:absolute;top:8px;right:8px;width:6px;height:6px;border-radius:50%;background:#888"></div>';
    if(!p.url)h+='<span style="font-size:9px;color:#444;letter-spacing:1px">'+p.label+'</span>';
    h+='</div>';
    h+='<div style="padding:8px 10px;background:#0a0a0a;display:flex;justify-content:space-between;align-items:center"><div style="display:flex;gap:3px">'+hS(p.stars,p.id)+'</div><div style="display:flex;gap:5px">'+hD(p.id,p.color)+'</div></div></div>';
  }
  h+='</div>';return h;
}

/* Main render */
function R(){
  var g=document.getElementById('APP');if(!g)return;
  if(!D.days.length){g.innerHTML='<div class="loading">No data yet. Upload photos from the admin panel.</div>';return;}
  var cd=null,cl=null;for(var i=0;i<D.days.length;i++){if(D.days[i].id===D.aDay){cd=D.days[i];break;}}
  if(cd&&cd.looks){for(var j=0;j<cd.looks.length;j++){if(cd.looks[j].id===D.aLook){cl=cd.looks[j];break;}}}
  var lp=[],fi=[];if(cl){for(var k=0;k<D.photos.length;k++){if(D.photos[k].look_id===D.aLook)lp.push(D.photos[k]);}}
  for(var m=0;m<lp.length;m++){var ph=lp[m];var st=ph.stars||0;var ok=!D.filt||(D.filt==='s5'&&st===5)||(D.filt==='s4'&&st===4)||(D.filt==='s3'&&st===3)||(D.filt==='s2'&&st===2)||(D.filt==='s1'&&st===1)||(D.filt==='c0'&&ph.color===0)||(D.filt==='c1'&&ph.color===1)||(D.filt==='c2'&&ph.color===2)||(D.filt==='notes'&&ph.note&&ph.note.trim());if(ok)fi.push(ph);}
  var ts=0,tst=0;for(var n=0;n<D.photos.length;n++){if(D.photos[n].color===2)ts++;if(D.photos[n].stars>0)tst++;}
  var h='';

  /* Header */
  h+='<div style="padding:20px 24px 16px;border-bottom:.5px solid #333;display:flex;justify-content:space-between;align-items:center"><div style="display:flex;align-items:center;gap:14px"><div style="width:40px;height:40px;border-radius:10px;background:#111;border:.5px solid #333;display:flex;align-items:center;justify-content:center"><span style="font-size:8px;color:#444">VG</span></div><div><div style="font-size:18px;font-weight:300;letter-spacing:-.5px">VG Studio Gallery</div><div style="font-size:9px;color:#555;letter-spacing:2px;text-transform:uppercase;margin-top:3px">'+D.photos.length+' img &middot; '+D.days.length+' days</div></div></div>';
  h+='<div style="display:flex;gap:12px;font-size:10px;color:#666;text-transform:uppercase;letter-spacing:1px"><span>&#9733; '+tst+'</span><span style="color:#2ECC71">&bull; '+ts+'</span></div></div>';

  /* Nav */
  h+='<div style="display:flex;border-bottom:.5px solid #333;overflow-x:auto">';
  h+='<button style="padding:12px 18px;border-right:.5px solid #222;border-bottom:1px solid '+(D.aLook==='moodboard'&&!D.aDay?'#fff':'transparent')+';margin-bottom:-1px;background:'+(D.aLook==='moodboard'&&!D.aDay?'#0d0d0d':'transparent')+';color:'+(D.aLook==='moodboard'&&!D.aDay?'#fff':'#888')+';border-top:none;border-left:none;font-family:inherit" onclick="xV(\'moodboard\')"><div style="font-size:11px;font-weight:600">Moodboard</div></button>';
  for(var di=0;di<D.days.length;di++){var dd=D.days[di],da=D.aDay===dd.id;
    h+='<button style="padding:12px 18px;border-right:.5px solid #222;border-bottom:1px solid '+(da?'#fff':'transparent')+';margin-bottom:-1px;background:'+(da?'#0d0d0d':'transparent')+';color:'+(da?'#fff':'#888')+';border-top:none;border-left:none;font-family:inherit;text-align:left" onclick="xD(\''+dd.id+'\')"><div style="font-size:11px;font-weight:600">'+dd.name+'</div><div style="font-size:9px;color:#444;margin-top:2px">'+(dd.looks?dd.looks.length:0)+' looks</div></button>';}
  h+='<button style="padding:12px 18px;border-left:.5px solid #222;border-bottom:1px solid '+(D.aLook==='summary'&&!D.aDay?'#fff':'transparent')+';margin-bottom:-1px;background:'+(D.aLook==='summary'&&!D.aDay?'#0d0d0d':'transparent')+';color:'+(D.aLook==='summary'&&!D.aDay?'#fff':'#888')+';border-top:none;border-right:none;margin-left:auto;font-family:inherit" onclick="xV(\'summary\')"><div style="font-size:11px;font-weight:600">Summary</div></button></div>';

  /* Subnav */
  if(cd&&cd.looks){h+='<div style="display:flex;border-bottom:.5px solid #222;background:#080808;overflow-x:auto">';for(var li=0;li<cd.looks.length;li++){var lk=cd.looks[li],la=D.aLook===lk.id;h+='<button style="padding:10px 16px;border-right:.5px solid #1a1a1a;border-bottom:1px solid '+(la?'#fff':'transparent')+';margin-bottom:-1px;background:'+(la?'#000':'transparent')+';border-top:none;border-left:none;font-family:inherit;text-align:left" onclick="xL(\''+lk.id+'\')"><div style="font-size:11px;color:'+(la?'#fff':'#888')+'">'+lk.name+'</div><div style="font-size:9px;color:#333;margin-top:2px">'+(lk.description||'')+'</div></button>';}h+='</div>';}

  /* Content */
  if(D.aLook==='summary'&&!D.aDay){
    var rc=0,vc=0,nc=0;for(var q=0;q<D.photos.length;q++){if(D.photos[q].color===0)rc++;if(D.photos[q].color===1)vc++;if(D.photos[q].note)nc++;}
    h+='<div style="padding:16px 24px"><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">';
    var pills=[['Total',D.photos.length,'#fff'],['Selected',ts,'#2ECC71'],['Starred',tst,'#fff'],['Rejected',rc,'#E74C3C'],['Review',vc,'#F39C12'],['Notes',nc,'#aaa']];
    for(var pi=0;pi<pills.length;pi++){h+='<div style="background:#0a0a0a;border:.5px solid #222;border-radius:8px;padding:8px 14px;display:flex;align-items:center;gap:10px"><span style="font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#555">'+pills[pi][0]+'</span><span style="font-size:18px;font-weight:300;color:'+pills[pi][2]+'">'+pills[pi][1]+'</span></div>';}
    h+='</div>';
    h+='<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:16px"><span style="font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#555;margin-right:4px">Stars</span>';
    for(var sf=5;sf>=1;sf--){var cnt=0;for(var sc=0;sc<D.photos.length;sc++){if(D.photos[sc].stars===sf)cnt++;}h+='<button style="padding:4px 12px;font-size:11px;border-radius:99px;border:.5px solid '+(D.sf===sf?'#fff':'#333')+';background:'+(D.sf===sf?'#fff':'#111')+';color:'+(D.sf===sf?'#000':'#aaa')+';cursor:pointer;font-family:inherit" onclick="xSF('+sf+')">'+'&#9733;'.repeat(sf)+' ('+cnt+')</button>';}
    if(D.sf)h+='<button style="padding:4px 8px;border-radius:99px;border:.5px solid #333;background:#111;color:#aaa;cursor:pointer;font-family:inherit" onclick="xSF(null)">&times;</button>';
    h+='</div>';
    if(D.sf){var sp=[];for(var si=0;si<D.photos.length;si++){if(D.photos[si].stars===D.sf)sp.push(D.photos[si]);}h+=sp.length?hG(sp):'<div style="text-align:center;padding:48px;color:#333;font-size:11px">No photos</div>';}
    else{for(var dsi=0;dsi<D.days.length;dsi++){var ddd=D.days[dsi];h+='<div style="margin-bottom:12px"><div style="font-size:11px;font-weight:600;padding:6px 0;border-bottom:.5px solid #222;margin-bottom:6px">'+ddd.name+'</div>';if(ddd.looks){for(var lsi=0;lsi<ddd.looks.length;lsi++){var llk=ddd.looks[lsi],lkP=[],lkS=0,lkSt=0;for(var lp2=0;lp2<D.photos.length;lp2++){if(D.photos[lp2].look_id===llk.id){lkP.push(D.photos[lp2]);if(D.photos[lp2].color===2)lkS++;if(D.photos[lp2].stars>0)lkSt++;}}h+='<div style="background:#0a0a0a;border:.5px solid #1a1a1a;border-radius:8px;padding:10px 16px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center"><div><span style="font-size:12px;font-weight:500">'+llk.name+'</span></div><div style="display:flex;gap:10px;font-size:10px;color:#555"><span>'+lkP.length+' img</span><span style="color:#2ECC71">&bull; '+lkS+'</span><span>&#9733; '+lkSt+'</span></div></div>';}}h+='</div>';}}
    h+='</div>';
  }else if(D.aLook==='moodboard'&&!D.aDay){
    h+='<div style="padding:20px">';
    if(!D.mb.length)h+='<div style="text-align:center;padding:48px;font-size:11px;color:#333;letter-spacing:2px;text-transform:uppercase">No moodboard references</div>';
    else{h+='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:2px;border-radius:8px;overflow:hidden">';for(var mi=0;mi<D.mb.length;mi++){h+='<div style="position:relative"><img src="'+D.mb[mi].url+'" loading="lazy" style="width:100%;aspect-ratio:1;object-fit:cover;display:block"/></div>';}h+='</div>';}
    h+='</div>';
  }else if(cl){
    h+='<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 20px;border-bottom:.5px solid #222;flex-wrap:wrap;gap:4px"><div style="display:flex;align-items:center;gap:2px;flex-wrap:wrap">';
    for(var sf2=5;sf2>=1;sf2--){var sa=D.filt==='s'+sf2;h+='<button style="padding:5px 10px;font-size:12px;background:'+(sa?'#fff':'transparent')+';color:'+(sa?'#000':'#555')+';border:none;border-radius:6px;cursor:pointer;font-family:inherit" onclick="xF(\'s'+sf2+'\')">'+'★'.repeat(sf2)+'</button>';}
    var ccfilt=[['c0','#E74C3C'],['c1','#F39C12'],['c2','#2ECC71']];for(var ci2=0;ci2<ccfilt.length;ci2++){var cca=D.filt===ccfilt[ci2][0];h+='<button style="padding:5px 10px;font-size:16px;background:'+(cca?ccfilt[ci2][1]:'transparent')+';color:'+(cca?'#000':ccfilt[ci2][1])+';border:none;border-radius:6px;cursor:pointer;line-height:1" onclick="xF(\''+ccfilt[ci2][0]+'\')">●</button>';}
    var na=D.filt==='notes';h+='<button style="padding:5px 10px;font-size:10px;letter-spacing:1px;text-transform:uppercase;background:'+(na?'#fff':'transparent')+';color:'+(na?'#000':'#555')+';border:none;border-radius:6px;cursor:pointer;font-family:inherit" onclick="xF(\'notes\')">NOTAS</button>';
    if(D.filt)h+='<button style="padding:5px 8px;font-size:14px;background:transparent;color:#444;border:none;cursor:pointer" onclick="xF(null)">&times;</button>';
    h+='</div><span style="font-size:10px;color:#444;letter-spacing:1px;text-transform:uppercase">'+fi.length+'/'+lp.length+'</span></div>';
    h+=hG(fi);
  }

  /* Modal */
  if(D.sel){var sel=D.sel;
    h+='<div style="position:fixed;inset:0;background:rgba(0,0,0,.96);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px" onclick="xCl()"><div style="background:#0a0a0a;border:.5px solid #333;border-radius:12px;width:100%;max-width:400px;overflow:hidden" onclick="event.stopPropagation()">';
    h+='<div style="aspect-ratio:2/3;background:#111;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden">';
    if(sel.url)h+='<img src="'+sel.url+'" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"/>';
    if(sel.color!==null&&sel.color!==undefined)h+='<div style="position:absolute;top:12px;left:12px;display:flex;align-items:center;gap:6px"><div style="width:8px;height:8px;border-radius:50%;background:'+CC[sel.color]+'"></div><span style="font-size:9px;color:'+CC[sel.color]+';letter-spacing:2px;text-transform:uppercase">'+CL[sel.color]+'</span></div>';
    if(!sel.url)h+='<span style="font-size:11px;color:#444;letter-spacing:2px">'+sel.label+'</span>';
    h+='</div><div style="padding:14px 16px;border-top:.5px solid #333"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div style="display:flex;gap:3px">'+hS(sel.stars,sel.id)+'</div><div style="display:flex;gap:10px">'+hMD(sel.id,sel.color)+'</div></div>';
    h+='<textarea style="width:100%;background:#111;border:.5px solid #333;border-radius:8px;padding:10px 12px;color:#fff;font-size:13px;font-family:inherit;resize:none;height:64px;outline:none;box-sizing:border-box" placeholder="Add note..." oninput="xN(this.value)">'+sel.note+'</textarea>';
    h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px"><span style="font-size:9px;color:#555;letter-spacing:1px;text-transform:uppercase">'+sel.label+'</span><button style="padding:8px 18px;font-size:9px;letter-spacing:2px;text-transform:uppercase;background:#fff;color:#000;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-family:inherit" onclick="xCl()">Save</button></div></div></div></div>';
  }
  g.innerHTML=h;
}

window.onload=loadAll;
</script>
</body>
</html>
