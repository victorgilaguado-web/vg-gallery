/* ── State ── */
var S={
  days:[], photos:[], mb:[],
  aDay:null, aLook:null,
  filt:null, sf:null,
  sel:null, note:'',
  projName:'VG Studio Gallery', clientLogo:null
};
var COLORS=['#E74C3C','#F39C12','#2ECC71'];
var CLABELS=['Reject','Review','Select'];

/* ── API ── */
function api(table,method,params,body){
  var url=SB+'/rest/v1/'+table+(params?'?'+params:'');
  var h={'apikey':SK,'Authorization':'Bearer '+SK,'Content-Type':'application/json'};
  if(method==='POST')h['Prefer']='return=representation';
  if(method==='PATCH')h['Prefer']='return=minimal';
  return fetch(url,{method:method,headers:h,body:body?JSON.stringify(body):undefined})
    .then(function(r){
      if(method==='PATCH'||method==='DELETE')return null;
      return r.json().then(function(d){if(!r.ok)throw new Error(d.message||r.status);return d;});
    });
}

/* ── Thumb ── */
function thumb(url,w){
  w=w||800;
  if(!url)return '';
  if(url.indexOf('cloudinary.com')>-1){
    // Insert transform right after /upload/ keeping version intact
    return url.replace('/upload/','/upload/w_'+w+',q_auto,f_auto,dpr_auto/');
  }
  return url;
}

/* ── Load ── */
function load(){
  Promise.all([
    api('days','GET','project_id=eq.'+PID+'&order=sort_order').catch(function(){return[];}),
    api('photos','GET','order=sort_order').catch(function(){return[];}),
    api('moodboard','GET','project_id=eq.'+PID).catch(function(){return[];})
  ]).then(function(r){
    S.days=r[0]||[]; S.photos=r[1]||[]; S.mb=r[2]||[];
    return Promise.all(S.days.map(function(d){
      return api('looks','GET','day_id=eq.'+d.id+'&order=sort_order').catch(function(){return[];});
    }));
  }).then(function(la){
    S.days.forEach(function(d,i){d.looks=la[i]||[];});
    // filter photos to known looks
    var lids={};
    S.days.forEach(function(d){d.looks.forEach(function(l){lids[l.id]=1;});});
    S.photos=S.photos.filter(function(p){return !p.look_id||lids[p.look_id];});
    if(S.days.length){
      S.aDay=S.days[0].id;
      if(S.days[0].looks.length)S.aLook=S.days[0].looks[0].id;
    }
    api('projects','GET','id=eq.'+PID).then(function(p){
      if(p&&p[0]){
        S.projName=p[0].name||S.projName;
        S.clientLogo=p[0].client_logo||null;
      } else {
        // Row doesn't exist yet — create it (only admin should do this, not gallery)
      // Just render with defaults
      }
    }).catch(function(){}).then(function(){render();});
  }).catch(function(e){
    document.getElementById('APP').innerHTML='<div class="loading">Error: '+e.message+'</div>';
  });
}

/* ── Save ── */
function savePhoto(id,patch){api('photos','PATCH','id=eq.'+id,patch);}
function saveProject(patch){
  // PATCH existing row - only update the specific fields
  var h={'apikey':SK,'Authorization':'Bearer '+SK,'Content-Type':'application/json','Prefer':'return=minimal'};
  fetch(SB+'/rest/v1/projects?id=eq.'+PID,{method:'PATCH',headers:h,body:JSON.stringify(patch)})
  .then(function(r){
    // If PATCH affected 0 rows, INSERT with upsert
    if(r.status===204||r.ok)return;
    var h2=Object.assign({},h,{'Prefer':'resolution=merge-duplicates,return=minimal'});
    var body=Object.assign({id:PID,name:S.projName,client_logo:S.clientLogo||null},patch);
    return fetch(SB+'/rest/v1/projects',{method:'POST',headers:h2,body:JSON.stringify(body)});
  }).catch(function(){});
}

/* ── Helpers ── */
function el(tag,css,text){
  var e=document.createElement(tag);
  if(css)e.style.cssText=css;
  if(text!==undefined)e.textContent=text;
  return e;
}
function btn(css){var b=document.createElement('button');b.style.cssText='cursor:pointer;font-family:inherit;border:none;background:transparent;'+css;return b;}
function filterPhotos(photos){
  if(!S.filt)return photos;
  return photos.filter(function(p){
    var st=parseInt(p.stars)||0;
    var col=p.color===null||p.color===undefined?-1:parseInt(p.color);
    if(S.filt==='s5')return st===5;
    if(S.filt==='s4')return st===4;
    if(S.filt==='s3')return st===3;
    if(S.filt==='s2')return st===2;
    if(S.filt==='s1')return st===1;
    if(S.filt==='c0')return col===0;
    if(S.filt==='c1')return col===1;
    if(S.filt==='c2')return col===2;
    if(S.filt==='notes')return !!(p.note&&p.note.trim());
    return true;
  });
}

/* ── Stars widget (DOM) ── */
function makeStars(photo){
  var wrap=el('div','display:flex;gap:2px');
  for(var s=1;s<=5;s++){
    (function(star){
      var sp=el('span','font-size:14px;cursor:pointer;user-select:none');
      sp.innerHTML='&#9733;';
      function update(){
        sp.style.color=(parseInt(photo.stars)||0)>=star?'#fff':'#444';
      }
      update();
      sp.addEventListener('mouseenter',function(){
        wrap.querySelectorAll('span').forEach(function(x,i){x.style.color=i<star?'#fff':'#444';});
      });
      sp.addEventListener('mouseleave',function(){update();});
      sp.addEventListener('click',function(e){
        e.stopPropagation();
        var cur=parseInt(photo.stars)||0;
        var next=cur===star?0:star;
        photo.stars=next;
        savePhoto(photo.id,{stars:next});
        wrap.querySelectorAll('span').forEach(function(x,i){x.style.color=i<next?'#fff':'#444';});
      });
      wrap.appendChild(sp);
    })(s);
  }
  return wrap;
}

/* ── Color dots (DOM) ── */
function makeColors(photo){
  var wrap=el('div','display:flex;gap:3px;align-items:center');
  for(var i=0;i<3;i++){
    (function(ci){
      var d=el('div','width:8px;height:8px;border-radius:50%;cursor:pointer');
      function update(){
        var cur=photo.color===null||photo.color===undefined?-1:parseInt(photo.color);
        d.style.background=cur===ci?COLORS[ci]:'#333';
        d.style.border='.5px solid '+(cur===ci?COLORS[ci]:'#444');
      }
      update();
      d.addEventListener('click',function(e){
        e.stopPropagation();
        var cur=photo.color===null||photo.color===undefined?-1:parseInt(photo.color);
        var next=cur===ci?null:ci;
        photo.color=next;
        savePhoto(photo.id,{color:next});
        // update all color dots for this photo
        update();
        render();
      });
      wrap.appendChild(d);
    })(i);
  }
  return wrap;
}

/* ── Photo grid (DOM) ── */
function makeGrid(photos){
  if(!photos.length){
    var e=el('div','text-align:center;padding:48px;font-size:11px;color:#333;letter-spacing:2px;text-transform:uppercase','Sin fotos');
    return e;
  }
  var grid=el('div','display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#111');
  photos.forEach(function(p){
    var col=p.color===null||p.color===undefined?-1:parseInt(p.color);
    var st=parseInt(p.stars)||0;

    var card=el('div','background:#000;cursor:pointer');
    var imgWrap=el('div','aspect-ratio:3/2;position:relative;overflow:hidden;background:#111');

    if(p.url){
      var img=el('img','position:absolute;inset:0;width:100%;height:100%;object-fit:cover');
      img.src=thumb(p.url,1000);
      img.onerror=function(){this.style.opacity='0.1';};
      imgWrap.appendChild(img);
    }
    if(col>=0){
      var dot=el('div','position:absolute;top:6px;left:6px;width:8px;height:8px;border-radius:50%;background:'+COLORS[col]);
      imgWrap.appendChild(dot);
    }
    if(st>0){
      var stBadge=el('div','position:absolute;top:5px;right:5px;font-size:9px;color:#fff;background:rgba(0,0,0,.6);padding:1px 4px;border-radius:3px',st+'★');
      imgWrap.appendChild(stBadge);
    }
    card.appendChild(imgWrap);

    var footer=el('div','padding:6px 10px;display:flex;justify-content:space-between;align-items:center;background:#060606;border-top:.5px solid #111');
    footer.appendChild(makeStars(p));
    footer.appendChild(makeColors(p));
    card.appendChild(footer);

    card.addEventListener('click',function(){openModal(p);});
    grid.appendChild(card);
  });
  return grid;
}

/* ── Filter bar (DOM) ── */
function makeFilterBar(lookPhotos){
  var filtPhotos=filterPhotos(lookPhotos);
  var bar=el('div','display:flex;align-items:center;justify-content:space-between;padding:7px 20px;border-bottom:.5px solid #111;flex-wrap:wrap;gap:4px;background:#030303');
  var left=el('div','display:flex;align-items:center;gap:2px;flex-wrap:wrap');

  // star filters
  ['s5','s4','s3','s2','s1'].forEach(function(key,i){
    var stars=5-i;
    var b=btn('padding:4px 8px;font-size:11px;border-radius:5px;background:'+(S.filt===key?'#fff':'transparent')+';color:'+(S.filt===key?'#000':'#555'));
    b.innerHTML='&#9733;'.repeat(stars);
    b.addEventListener('click',function(){S.filt=(S.filt===key)?null:key;render();});
    left.appendChild(b);
  });
  // color filters
  COLORS.forEach(function(c,i){
    var key='c'+i;
    var b=btn('padding:4px 8px;font-size:15px;border-radius:5px;background:'+(S.filt===key?c:'transparent')+';color:'+(S.filt===key?'#000':c));
    b.innerHTML='&#9679;';
    b.addEventListener('click',function(){S.filt=(S.filt===key)?null:key;render();});
    left.appendChild(b);
  });
  // notes
  var nb=btn('padding:4px 8px;font-size:9px;letter-spacing:1px;text-transform:uppercase;border-radius:5px;background:'+(S.filt==='notes'?'#fff':'transparent')+';color:'+(S.filt==='notes'?'#000':'#555'),'NOTAS');
  nb.textContent='NOTAS';
  nb.addEventListener('click',function(){S.filt=(S.filt==='notes')?null:'notes';render();});
  left.appendChild(nb);
  // clear
  if(S.filt){
    var cb=btn('padding:4px 6px;font-size:13px;color:#555');
    cb.innerHTML='&times;';
    cb.addEventListener('click',function(){S.filt=null;render();});
    left.appendChild(cb);
  }
  bar.appendChild(left);
  var count=el('span','font-size:10px;color:#444;letter-spacing:1px',filtPhotos.length+'/'+lookPhotos.length);
  bar.appendChild(count);

  var wrap=el('div');
  wrap.appendChild(bar);
  wrap.appendChild(makeGrid(filtPhotos));
  return wrap;
}

/* ── Modal ── */
function openModal(photo){S.sel=photo;S.note=photo.note||'';render();}
function closeModal(){S.sel=null;render();}

function makeModal(photo){
  var overlay=el('div','position:fixed;inset:0;background:rgba(0,0,0,.97);display:flex;z-index:100');
  overlay.addEventListener('click',closeModal);

  var imgSide=el('div','flex:1;display:flex;align-items:center;justify-content:center;padding:20px');
  imgSide.addEventListener('click',function(e){e.stopPropagation();});
  var imgInner=el('div','max-width:400px;width:100%');
  var imgBox=el('div','aspect-ratio:3/2;position:relative;background:#111;overflow:hidden;cursor:zoom-in');
  var zoomScale=1, zoomX=50, zoomY=50;
  if(photo.url){
    var img=el('img','position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:'+zoomX+'% '+zoomY+'%;transition:transform .2s');
    img.src=thumb(photo.url,1400);
    // Click to zoom
    imgBox.addEventListener('click',function(e){
      e.stopPropagation();
      var rect=imgBox.getBoundingClientRect();
      zoomX=Math.round((e.clientX-rect.left)/rect.width*100);
      zoomY=Math.round((e.clientY-rect.top)/rect.height*100);
      if(zoomScale===1){zoomScale=2.5;imgBox.style.cursor='zoom-out';}
      else{zoomScale=1;imgBox.style.cursor='zoom-in';}
      img.style.transformOrigin=zoomX+'% '+zoomY+'%';
      img.style.transform='scale('+zoomScale+')';
    });
    // Scroll to zoom
    imgBox.addEventListener('wheel',function(e){
      e.preventDefault();e.stopPropagation();
      var rect=imgBox.getBoundingClientRect();
      zoomX=Math.round((e.clientX-rect.left)/rect.width*100);
      zoomY=Math.round((e.clientY-rect.top)/rect.height*100);
      zoomScale=Math.min(4,Math.max(1,zoomScale-(e.deltaY>0?0.3:-0.3)));
      imgBox.style.cursor=zoomScale>1?'zoom-out':'zoom-in';
      img.style.transformOrigin=zoomX+'% '+zoomY+'%';
      img.style.transform='scale('+zoomScale+')';
    });
    imgBox.appendChild(img);
  }
  var col=photo.color===null||photo.color===undefined?-1:parseInt(photo.color);
  if(col>=0){
    var dot=el('div','position:absolute;top:10px;left:10px;width:10px;height:10px;border-radius:50%;background:'+COLORS[col]);
    imgBox.appendChild(dot);
  }
  imgInner.appendChild(imgBox);
  imgSide.appendChild(imgInner);

  var panel=el('div','width:280px;border-left:.5px solid #222;display:flex;flex-direction:column;padding:20px;gap:16px');
  panel.addEventListener('click',function(e){e.stopPropagation();});

  panel.appendChild(el('div','font-size:11px;color:#555;letter-spacing:1px;text-transform:uppercase',photo.label||''));

  // stars
  var stWrap=el('div');
  stWrap.appendChild(el('div','font-size:9px;color:#555;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px','Estrellas'));
  stWrap.appendChild(makeStars(photo));
  panel.appendChild(stWrap);

  // color labels
  var clWrap=el('div');
  clWrap.appendChild(el('div','font-size:9px;color:#555;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px','Etiqueta'));
  var clRow=el('div','display:flex;gap:8px');
  COLORS.forEach(function(c,i){
    var row=el('div','display:flex;align-items:center;gap:4px;cursor:pointer');
    var cur=photo.color===null||photo.color===undefined?-1:parseInt(photo.color);
    row.style.opacity=cur===i?'1':'0.35';
    var d=el('div','width:8px;height:8px;border-radius:50%;background:'+c);
    var lbl=el('span','font-size:9px;letter-spacing:1px;text-transform:uppercase;color:'+c,CLABELS[i]);
    row.appendChild(d);row.appendChild(lbl);
    row.addEventListener('click',function(){
      var cur2=photo.color===null||photo.color===undefined?-1:parseInt(photo.color);
      photo.color=cur2===i?null:i;
      savePhoto(photo.id,{color:photo.color});
      render();
    });
    clRow.appendChild(row);
  });
  clWrap.appendChild(clRow);
  panel.appendChild(clWrap);

  // note
  var noteWrap=el('div','flex:1;display:flex;flex-direction:column');
  noteWrap.appendChild(el('div','font-size:9px;color:#555;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px','Nota'));
  var ta=document.createElement('textarea');
  ta.style.cssText='flex:1;min-height:100px;background:#0a0a0a;border:.5px solid #333;border-radius:4px;color:#fff;padding:8px;font-family:inherit;font-size:12px;resize:none;width:100%';
  ta.value=photo.note||'';
  ta.addEventListener('input',function(){S.note=ta.value;});
  noteWrap.appendChild(ta);
  panel.appendChild(noteWrap);

  // buttons
  var bRow=el('div','display:flex;gap:8px');
  var saveBtn=btn('flex:1;padding:10px;background:#fff;color:#000;border-radius:6px;font-size:11px;letter-spacing:1px;text-transform:uppercase');
  saveBtn.textContent='Guardar';
  saveBtn.addEventListener('click',function(){
    photo.note=S.note;
    savePhoto(photo.id,{note:S.note});
    closeModal();
  });
  var closeBtn=btn('padding:10px 14px;color:#555;border:.5px solid #333;border-radius:6px;font-size:11px');
  closeBtn.innerHTML='&#10005;';
  closeBtn.addEventListener('click',closeModal);
  bRow.appendChild(saveBtn);bRow.appendChild(closeBtn);
  panel.appendChild(bRow);

  overlay.appendChild(imgSide);
  overlay.appendChild(panel);
  return overlay;
}

/* ── Summary ── */
function makeSummary(){
  var wrap=el('div','padding:16px 20px');

  // pills
  var rc=S.photos.filter(function(p){return parseInt(p.color)===0;}).length;
  var vc=S.photos.filter(function(p){return parseInt(p.color)===1;}).length;
  var sel=S.photos.filter(function(p){return parseInt(p.color)===2;}).length;
  var starred=S.photos.filter(function(p){return parseInt(p.stars)>0;}).length;
  var noted=S.photos.filter(function(p){return p.note&&p.note.trim();}).length;
  var pills=[['Total',S.photos.length],['★ Stars',starred],['● Select',sel],['Reject',rc],['Review',vc],['Notas',noted]];
  var pillRow=el('div','display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px');
  pills.forEach(function(p){
    var box=el('div','background:#0a0a0a;border:.5px solid #222;border-radius:8px;padding:8px 14px;text-align:center');
    box.appendChild(el('div','font-size:9px;color:#555;letter-spacing:2px;text-transform:uppercase',p[0]));
    box.appendChild(el('div','font-size:20px;font-weight:300;margin-top:4px',String(p[1])));
    pillRow.appendChild(box);
  });
  wrap.appendChild(pillRow);

  // filter row
  var fRow=el('div','display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px');
  for(var sf=5;sf>=1;sf--){
    (function(stars){
      var key='s'+stars;
      var cnt=S.photos.filter(function(p){return parseInt(p.stars)===stars;}).length;
      var b=btn('padding:4px 10px;font-size:11px;border-radius:99px;border:.5px solid '+(S.sf===key?'#fff':'#333')+';background:'+(S.sf===key?'#fff':'#111')+';color:'+(S.sf===key?'#000':'#aaa'));
      b.innerHTML='&#9733;'.repeat(stars)+' ('+cnt+')';
      b.addEventListener('click',function(){S.sf=(S.sf===key)?null:key;render();});
      fRow.appendChild(b);
    })(sf);
  }
  COLORS.forEach(function(c,i){
    var key='c'+i;
    var cnt=S.photos.filter(function(p){return parseInt(p.color)===i;}).length;
    var b=btn('padding:4px 10px;font-size:11px;border-radius:99px;border:.5px solid '+(S.sf===key?c:'#333')+';background:'+(S.sf===key?c:'#111')+';color:'+(S.sf===key?'#000':'#aaa'));
    b.innerHTML='&#9679; '+CLABELS[i]+' ('+cnt+')';
    b.addEventListener('click',function(){S.sf=(S.sf===key)?null:key;render();});
    fRow.appendChild(b);
  });
  if(S.sf){
    var clr=btn('padding:4px 8px;border-radius:99px;border:.5px solid #333;background:#111;color:#aaa');
    clr.innerHTML='&times;';
    clr.addEventListener('click',function(){S.sf=null;render();});
    fRow.appendChild(clr);
  }
  // notes filter button
  var nfb=btn('padding:4px 10px;font-size:11px;border-radius:99px;border:.5px solid '+(S.sf==='notes'?'#fff':'#333')+';background:'+(S.sf==='notes'?'#fff':'#111')+';color:'+(S.sf==='notes'?'#000':'#aaa')+';cursor:pointer');
  var notedCnt=S.photos.filter(function(p){return p.note&&p.note.trim();}).length;
  nfb.textContent='✏ Notas ('+notedCnt+')';
  nfb.addEventListener('click',function(){S.sf=(S.sf==='notes')?null:'notes';render();});
  fRow.appendChild(nfb);
  wrap.appendChild(fRow);

  if(S.sf){
    var sfPhotos=S.photos.filter(function(p){
      var st=parseInt(p.stars)||0;
      var col=p.color===null||p.color===undefined?-1:parseInt(p.color);
      if(S.sf==='s5')return st===5;if(S.sf==='s4')return st===4;if(S.sf==='s3')return st===3;
      if(S.sf==='s2')return st===2;if(S.sf==='s1')return st===1;
      if(S.sf==='c0')return col===0;if(S.sf==='c1')return col===1;if(S.sf==='c2')return col===2;
      if(S.sf==='notes')return !!(p.note&&p.note.trim());
      return false;
    });
    if(S.sf==='notes'){
      // Notes view: image + note side by side
      var notesList=el('div','display:flex;flex-direction:column;gap:1px;margin-top:4px');
      if(!sfPhotos.length){
        notesList.appendChild(el('div','padding:40px;text-align:center;font-size:11px;color:#333;letter-spacing:2px;text-transform:uppercase','Sin notas'));
      }
      sfPhotos.forEach(function(p){
        var row=el('div','display:flex;gap:0;background:#0a0a0a;border:.5px solid #1a1a1a;border-radius:0;overflow:hidden;cursor:pointer');
        row.addEventListener('click',function(){openModal(p);});
        // image
        var imgBox=el('div','width:120px;flex-shrink:0;position:relative;background:#111');
        var img=el('img','width:100%;height:100%;object-fit:cover;display:block;min-height:80px');
        img.src=thumb(p.url,240);
        imgBox.appendChild(img);
        // color dot
        var col2=p.color===null||p.color===undefined?-1:parseInt(p.color);
        if(col2>=0){
          var dot=el('div','position:absolute;top:6px;left:6px;width:7px;height:7px;border-radius:50%;background:'+COLORS[col2]);
          imgBox.appendChild(dot);
        }
        row.appendChild(imgBox);
        // content
        var info=el('div','flex:1;padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;gap:8px');
        var top=el('div','display:flex;justify-content:space-between;align-items:flex-start');
        var lbl=el('div','font-size:10px;color:#555;letter-spacing:1px;text-transform:uppercase',p.label||'');
        var st2=parseInt(p.stars)||0;
        var stEl=el('div','font-size:10px;color:#666');stEl.innerHTML=st2>0?'★'.repeat(st2):'';
        top.appendChild(lbl);top.appendChild(stEl);
        info.appendChild(top);
        var noteText=el('div','font-size:13px;color:#ccc;line-height:1.5;flex:1',p.note||'');
        info.appendChild(noteText);
        row.appendChild(info);
        notesList.appendChild(row);
      });
      wrap.appendChild(notesList);
    } else {
      wrap.appendChild(makeGrid(sfPhotos));
    }
  }
  return wrap;
}

/* ── Main render ── */
function render(){
  var app=document.getElementById('APP');
  if(!app)return;
  while(app.firstChild)app.removeChild(app.firstChild);

  var curDay=S.days.find(function(d){return d.id===S.aDay;})||null;
  var curLook=curDay&&curDay.looks?curDay.looks.find(function(l){return l.id===S.aLook;})||null:null;
  var totalStarred=S.photos.filter(function(p){return parseInt(p.stars)>0;}).length;
  var totalSel=S.photos.filter(function(p){return parseInt(p.color)===2;}).length;

  /* HEADER */
  var header=el('div','padding:0 28px;height:56px;border-bottom:.5px solid #1a1a1a;display:flex;justify-content:space-between;align-items:center;background:#000');
  
  // Left: VG logo + session name
  var hLeft=el('div','display:flex;align-items:center;gap:20px');
  var logo=el('img','height:40px;width:auto;filter:invert(1);opacity:.9');
  logo.src=VG_LOGO;
  logo.onerror=function(){this.style.display='none';};
  hLeft.appendChild(logo);
  
  // Divider
  hLeft.appendChild(el('div','width:.5px;height:28px;background:#222'));
  
  var hTitle=el('div');
  var nameEl=el('div','font-size:13px;font-weight:400;letter-spacing:.5px;cursor:pointer;color:#e8e8e8',S.projName);
  nameEl.title='Click para editar';
  nameEl.addEventListener('click',function(){editName(nameEl);});
  hTitle.appendChild(nameEl);
  hTitle.appendChild(el('div','font-size:9px;color:#444;letter-spacing:2px;text-transform:uppercase;margin-top:3px',S.photos.length+' fotos · '+S.days.length+' días'));
  hLeft.appendChild(hTitle);
  header.appendChild(hLeft);

  // Right: client logo + stats
  var hRight=el('div','display:flex;align-items:center;gap:20px');
  
  // Stats
  var stats=el('div','display:flex;gap:16px;align-items:center');
  stats.appendChild(el('div','font-size:10px;color:#555;letter-spacing:1px','★ '+totalStarred));
  stats.appendChild(el('div','font-size:10px;color:#555;letter-spacing:1px','● '+totalSel));
  hRight.appendChild(stats);
  
  // Divider
  if(S.clientLogo||true)hRight.appendChild(el('div','width:.5px;height:28px;background:#222'));
  
  var fileInput=document.createElement('input');
  fileInput.type='file';fileInput.accept='image/*';fileInput.style.display='none';
  fileInput.addEventListener('change',function(){uploadClientLogo(fileInput);});
  if(S.clientLogo){
    var cLogoWrap=el('div','display:flex;align-items:center;cursor:pointer;opacity:.85;transition:opacity .2s');
    cLogoWrap.style.cursor='pointer';
    var cLogo=el('img','height:36px;max-width:120px;width:auto;object-fit:contain;display:block');
    cLogo.src=S.clientLogo;
    cLogo.title='Cambiar logo';
    cLogoWrap.appendChild(cLogo);
    cLogoWrap.addEventListener('mouseenter',function(){this.style.opacity='1';});
    cLogoWrap.addEventListener('mouseleave',function(){this.style.opacity='.85';});
    cLogoWrap.addEventListener('click',function(){fileInput.click();});
    hRight.appendChild(cLogoWrap);
  } else {
    var addLogo=btn('font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:#3a3a3a;padding:7px 14px;border-radius:4px;border:.5px solid #2a2a2a');
    addLogo.style.border='.5px solid #2a2a2a';
    addLogo.textContent='+ LOGO CLIENTE';
    addLogo.addEventListener('mouseenter',function(){this.style.color='#777';this.style.borderColor='#444';});
    addLogo.addEventListener('mouseleave',function(){this.style.color='#3a3a3a';this.style.borderColor='#2a2a2a';});
    addLogo.addEventListener('click',function(){fileInput.click();});
    hRight.appendChild(addLogo);
  }
  hRight.appendChild(fileInput);
  header.appendChild(hRight);
  app.appendChild(header);

  /* DAY TABS */
  var tabs=el('div','display:flex;border-bottom:.5px solid #1a1a1a;overflow-x:auto;background:#000');
  function makeTab(label,active,onClick){
    var b=btn('padding:12px 18px;border-bottom:2px solid '+(active?'#e8e8e8':'transparent')+';color:'+(active?'#e8e8e8':'#4a4a4a')+';font-size:11px;white-space:nowrap;letter-spacing:.3px;transition:color .15s');
    b.innerHTML=label;
    b.addEventListener('mouseenter',function(){if(!active)this.style.color='#888';});
    b.addEventListener('mouseleave',function(){if(!active)this.style.color='#4a4a4a';});
    b.addEventListener('click',onClick);
    return b;
  }
  tabs.appendChild(makeTab('Moodboard',S.aLook==='moodboard'&&!S.aDay,function(){S.aDay=null;S.aLook='moodboard';S.filt=null;render();}));
  S.days.forEach(function(d){
    var inner='<span style="display:block">'+d.name+'</span><span style="display:block;font-size:9px;color:#444">'+((d.looks&&d.looks.length)||0)+' looks</span>';
    tabs.appendChild(makeTab(inner,S.aDay===d.id,function(){
      S.aDay=d.id;S.filt=null;
      S.aLook=d.looks&&d.looks.length?d.looks[0].id:null;
      render();
    }));
  });
  var summaryBtn=makeTab('Summary',S.aLook==='summary'&&!S.aDay,function(){S.aDay=null;S.aLook='summary';S.filt=null;render();});
  summaryBtn.style.marginLeft='auto';
  tabs.appendChild(summaryBtn);
  app.appendChild(tabs);

  /* LOOK TABS */
  if(curDay&&curDay.looks&&curDay.looks.length){
    var ltabs=el('div','display:flex;border-bottom:.5px solid #111;background:#050505;overflow-x:auto');
    curDay.looks.forEach(function(l){
      ltabs.appendChild(makeTab(l.name,S.aLook===l.id,function(){S.aLook=l.id;S.filt=null;render();}));
    });
    app.appendChild(ltabs);
  }

  /* CONTENT */
  if(S.aLook==='moodboard'&&!S.aDay){
    var mbWrap=el('div','padding:20px');
    if(!S.mb.length){
      mbWrap.appendChild(el('div','color:#333;font-size:11px;letter-spacing:2px;text-transform:uppercase;text-align:center;padding:48px','Sin imágenes en moodboard'));
    } else {
      var mbGrid=el('div','display:grid;grid-template-columns:repeat(3,1fr);gap:2px');
      S.mb.forEach(function(m){
        var d=el('div','aspect-ratio:1;overflow:hidden');
        var i=el('img','width:100%;height:100%;object-fit:cover');
        i.src=thumb(m.url,600);
        d.appendChild(i);mbGrid.appendChild(d);
      });
      mbWrap.appendChild(mbGrid);
    }
    app.appendChild(mbWrap);
  } else if(S.aLook==='summary'&&!S.aDay){
    app.appendChild(makeSummary());
  } else if(curLook){
    var lookPhotos=S.photos.filter(function(p){return p.look_id===S.aLook;});
    app.appendChild(makeFilterBar(lookPhotos));
  } else if(!S.days.length){
    app.appendChild(el('div','display:flex;align-items:center;justify-content:center;height:60vh;font-size:11px;color:#444;letter-spacing:3px;text-transform:uppercase','Sin datos. Sube fotos desde el admin.'));
  }

  /* MODAL */
  if(S.sel)app.appendChild(makeModal(S.sel));
}

/* ── Edit project name ── */
function editName(el_){
  var inp=document.createElement('input');
  inp.value=S.projName;
  inp.style.cssText='background:transparent;border:none;border-bottom:1px solid #555;color:#fff;font-size:15px;font-weight:300;font-family:inherit;outline:none;width:200px';
  el_.replaceWith(inp);inp.focus();inp.select();
  function commit(){
    var v=inp.value.trim()||S.projName;
    S.projName=v;saveProject({name:v});render();
  }
  inp.addEventListener('blur',commit);
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')inp.blur();if(e.key==='Escape'){inp.value=S.projName;inp.blur();}});
}

/* ── Upload client logo ── */
function uploadClientLogo(input){
  if(!input.files||!input.files[0])return;
  var fd=new FormData();
  fd.append('file',input.files[0]);fd.append('upload_preset',CP);
  fetch('https://api.cloudinary.com/v1_1/'+CN+'/image/upload',{method:'POST',body:fd})
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.error)throw new Error(d.error.message);
      S.clientLogo=d.secure_url;saveProject({client_logo:d.secure_url});render();
    }).catch(function(e){alert('Error: '+e.message);});
}

window.onload=function(){resolveProject(load);};
